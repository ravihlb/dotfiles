## Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'Space'

run '/usr/share/tmux-plugin-manager/tpm'

## Settings
set -g mouse on
set -g history-limit 9000
set -g display-time 750

# zsh as default
set -g default-shell /bin/zsh

# Colors
# set -g status-style bg="#013220"
set -g status-style bg="#1e0c25"
set -ag status-style fg="colour141"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Key bindings
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf\; display-message "Config reloaded."

# Sessions
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind K confirm kill-session

## Copy mode
unbind-key [
bind-key k copy-mode

## Vim style
set-window-option -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi v send-keys -X begin-selection

bind P paste-buffer


## Rebinding to always create new window on current path by default
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

## Move panes
# https://unix.stackexchange.com/a/14301
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key u command-prompt -p "send pane to:"  "join-pane -t '%%'"
